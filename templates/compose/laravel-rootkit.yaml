                printf '%s\n' '<p class="muted">Fix: In Coolify, set this service PHP Version to a compatible value (for copiservi use 8.3 or newer) and redeploy.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$COMPOSER_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
            fi
          fi

          # Browsershot auto-provisioning. If composer.lock references
          # spatie/browsershot we install Chromium + puppeteer-core
          # inside the container so PDF generation works out of the
          # box. Detection is composer.lock-based (not composer.json)
          # so we pick it up whether it is a direct require or a
          # transitive one. Projects that do not use browsershot pay
          # ZERO cost — the apk/npm calls below are never reached,
          # so image size and boot time stay the same for them.
          BROWSERSHOT_DETECTED=0
          if [ -f composer.lock ] && grep -q '"spatie/browsershot"' composer.lock 2>/dev/null; then
            BROWSERSHOT_DETECTED=1
            echo "Detected spatie/browsershot in composer.lock — installing Chromium + puppeteer-core..."
            apk add --no-cache \
              chromium \
              nss \
              freetype \
              harfbuzz \
              ca-certificates \
              ttf-freefont 2>&1 \
              || echo "WARN: Could not install Chromium system packages — PDF generation will fail"
            # puppeteer-core is the headless-browser client library
            # WITHOUT its own bundled Chromium download — paired with
            # CHROME_PATH (written into .env further down) pointing at
            # the system chromium binary the apk above just installed.
            # The global install makes the module resolvable both for
            # browsershot (which shells out to node) and anything the
            # project itself imports.
            if command -v npm >/dev/null 2>&1; then
              npm install -g puppeteer-core 2>&1 \
                || echo "WARN: Could not install puppeteer-core globally"
            fi
          fi

          if [ -f package.json ]; then
            echo "Installing frontend dependencies..."
            echo "Node version: $(node -v 2>/dev/null || echo unavailable)"
            echo "NPM version: $(npm -v 2>/dev/null || echo unavailable)"
            # Detect the package manager the project actually uses
            # instead of forcing npm on everyone. Priority:
            #   pnpm-lock.yaml → pnpm (fastest + strict)
            #   yarn.lock      → yarn classic (Laravel 8-10 default)
            #   package-lock.json or nothing → npm
            # This makes the template work on existing Laravel
            # projects without forcing the user to change their
            # frontend tooling.
            NPM_OUTPUT=""
            set +e
            if [ -f pnpm-lock.yaml ]; then
              echo "Detected pnpm-lock.yaml — using pnpm"
              if ! command -v pnpm >/dev/null 2>&1; then
                npm install -g pnpm@latest >/dev/null 2>&1 || true
              fi
              NPM_OUTPUT="$(pnpm install --frozen-lockfile 2>&1 && pnpm run build 2>&1)"
            elif [ -f yarn.lock ]; then
              echo "Detected yarn.lock — using yarn"
              if ! command -v yarn >/dev/null 2>&1; then
                npm install -g yarn >/dev/null 2>&1 || true
              fi
              NPM_OUTPUT="$(yarn install --frozen-lockfile 2>&1 && yarn run build 2>&1)"
            elif [ -f package-lock.json ]; then
              echo "Detected package-lock.json — using npm ci"
              NPM_OUTPUT="$(npm ci --no-audit --no-fund 2>&1 && npm run build 2>&1)"
            else
              echo "No lockfile detected — using npm install"
              NPM_OUTPUT="$(npm install --no-audit --no-fund 2>&1 && npm run build 2>&1)"
            fi
            NPM_EXIT="$?"
            set -e
            if [ "$NPM_EXIT" -ne 0 ]; then
              echo "$NPM_OUTPUT" >&2
              mkdir -p /var/www/html/public
              {
                printf '%s\n' '<!doctype html>'
                printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                printf '%s\n' '<title>Coolify: Frontend build failed</title>'
                printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px;color:#e5e7eb}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                printf '%s\n' '<div class="wrap"><div class="card">'
                printf '%s\n' '<h1>Frontend asset build failed</h1>'
                printf '%s\n' '<p>The service could not run <code>npm run build</code>, so CSS/JS assets are missing.</p>'
                printf '%s\n' '<p class="muted">Check Laravel logs in Coolify to see the exact npm error, fix the project build dependencies, and redeploy.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$NPM_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
              # Do NOT exit here. Nginx still needs to come up to serve the
              # error page above; the composer-install path follows the same
              # convention. Workers will keep failing and supervisord will
              # restart them, which is noisy but acceptable.
            # Build succeeded — verify the output manifest exists.
            # Laravel projects can use THREE different bundlers and
            # each writes the manifest to a different path. Accept
            # any of them so we do not flag Laravel 9 / 10 projects
            # on Laravel Mix as broken builds.
            elif [ -f /var/www/html/public/build/manifest.json ]; then
              echo "Vite manifest detected:"
              ls -la /var/www/html/public/build/manifest.json
            elif [ -f /var/www/html/public/mix-manifest.json ]; then
              echo "Laravel Mix manifest detected (Laravel 9/10 style):"
              ls -la /var/www/html/public/mix-manifest.json
            elif [ -f /var/www/html/public/build/.vite/manifest.json ]; then
              # Vite 5+ nests the manifest under .vite/
              echo "Vite 5+ manifest detected:"
              ls -la /var/www/html/public/build/.vite/manifest.json
            else
              echo "Build command finished but no frontend manifest was found." >&2
              mkdir -p /var/www/html/public
              {
                printf '%s\n' '<!doctype html>'
                printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                printf '%s\n' '<title>Coolify: frontend manifest missing</title>'
                printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px;color:#e5e7eb}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                printf '%s\n' '<div class="wrap"><div class="card">'
                printf '%s\n' '<h1>Frontend manifest not found</h1>'
                printf '%s\n' '<p>The frontend build command finished successfully but none of the known manifest files were generated:</p>'
                printf '%s\n' '<pre>public/build/manifest.json        (Vite 4 and earlier)'
                printf '%s\n' 'public/build/.vite/manifest.json  (Vite 5+)'
                printf '%s\n' 'public/mix-manifest.json          (Laravel Mix / Webpack)</pre>'
                printf '%s\n' '<p class="muted">Review the package.json scripts and the bundler config in the Laravel project. The build output above may indicate what happened.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$NPM_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
            fi
          fi

          DB_NAME="${SERVICE_DATABASE_LARAVEL:-${MYSQL_DATABASE:-laravel}}"
          DB_USER="${SERVICE_USER_LARAVEL:-${MYSQL_USER:-laravel}}"
          DB_PASSWORD="${SERVICE_PASSWORD_LARAVEL:-${MYSQL_PASSWORD:-password}}"

          if [ ! -f .env ]; then
             if [ -f .env.example ]; then
               cp .env.example .env
             else
               touch .env
             fi
             echo "" >> .env
             echo "DB_CONNECTION=mysql" >> .env
             echo "DB_HOST=mariadb" >> .env
             echo "DB_PORT=3306" >> .env
             echo "DB_DATABASE=${DB_NAME}" >> .env
             echo "DB_USERNAME=${DB_USER}" >> .env
             echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
             echo "APP_URL=${SERVICE_PUBLIC_URL_RUNTIME}" >> .env
             echo "ASSET_URL=" >> .env
          fi

          upsert_env() {
            key="$1"
            value="$2"
            escaped_value=$(printf '%s\n' "$value" | sed 's/[\/&]/\\&/g')
            if grep -Eq "^${key}=" .env; then
              sed -i "s/^${key}=.*/${key}=${escaped_value}/" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          upsert_env "APP_URL" "${SERVICE_PUBLIC_URL_RUNTIME}"
          # Keep assets on same host/domain as current request.
          # This avoids cert/domain mismatch when service internal URLs differ.
          upsert_env "ASSET_URL" ""
          upsert_env "DB_CONNECTION" "mysql"
          upsert_env "DB_HOST" "mariadb"
          upsert_env "DB_PORT" "3306"
          upsert_env "DB_DATABASE" "${DB_NAME}"
          upsert_env "DB_USERNAME" "${DB_USER}"
          upsert_env "DB_PASSWORD" "${DB_PASSWORD}"
          upsert_env "CACHE_STORE" "file"
          upsert_env "CACHE_DRIVER" "file"
          upsert_env "SESSION_DRIVER" "file"

          # If we detected and installed browsershot deps earlier,
          # point the Laravel config at the system chromium binary
          # and tell Node where the global modules live on alpine.
          # Browsershot reads CHROME_PATH at runtime to decide which
          # binary to launch; NODE_PATH lets node require('puppeteer-core')
          # resolve against the global install done above.
          if [ "${BROWSERSHOT_DETECTED:-0}" = "1" ]; then
            upsert_env "CHROME_PATH" "/usr/bin/chromium-browser"
            upsert_env "NODE_PATH" "/usr/local/lib/node_modules"
          fi

          if [ -f artisan ]; then
            echo "Running Laravel setup tasks..."
            CURRENT_APP_KEY="$(grep -E '^APP_KEY=' .env 2>/dev/null | tail -n 1 | cut -d '=' -f2-)"
            if [ -z "${CURRENT_APP_KEY}" ]; then
              php artisan key:generate --force || true
            fi
            php artisan optimize:clear || true
            php artisan view:clear || true
            php artisan config:clear || true
            # Create the public/storage symlink so Laravel apps that
            # serve user uploads out of storage/app/public work out
            # of the box. Idempotent: succeeds silently if the link
            # already exists, and is a no-op if the project does
            # not use the storage disk at all. `|| true` so a symlink
            # that already exists (from the persisted volume on
            # redeploy) does not abort the boot.
            php artisan storage:link 2>/dev/null || true
            DB_CONNECTION=mysql \
              DB_HOST=mariadb \
              DB_PORT=3306 \
              DB_DATABASE="${DB_NAME}" \
              DB_USERNAME="${DB_USER}" \
              DB_PASSWORD="${DB_PASSWORD}" \
              php artisan about >/dev/null 2>&1 || true
          fi

          mkdir -p /var/www/html/storage/logs
          mkdir -p /var/www/html/storage/framework/cache
          mkdir -p /var/www/html/storage/framework/sessions
          mkdir -p /var/www/html/storage/framework/views
          mkdir -p /var/www/html/bootstrap/cache

          # Only recursively chown the directories Laravel actually needs to
          # write to. Recursively chowning the whole project (vendor/, public/, ...)
          # is O(n) over all files and slows restarts noticeably for medium/large
          # apps. Source files stay owned by root with world-readable perms,
          # which is enough for the php-fpm worker (running as www-data) to read.
          chown www-data:www-data /var/www/html
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          chmod -R 775 /var/www/html/storage
          chmod -R 775 /var/www/html/bootstrap/cache

          max_wait=300
          waited=0
          while [ ! -f /var/www/html/artisan ]; do
            if [ $waited -ge $max_wait ]; then
              echo "WARNING: Laravel not ready after ${max_wait}s. Starting anyway so nginx can show an error page."
              mkdir -p /var/www/html/public
              if [ ! -f /var/www/html/public/_coolify_error.html ]; then
                {
                  printf '%s\n' '<!doctype html>'
                  printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                  printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                  printf '%s\n' '<title>Coolify: Laravel not ready</title>'
                  printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                  printf '%s\n' '<div class="wrap"><div class="card">'
                  printf '%s\n' '<h1>Laravel is not ready yet</h1>'
                  printf '%s\n' '<p>The application did not finish installing (no <code>artisan</code> file found).</p>'
                  printf '%s\n' '<p class="muted">Check the Laravel container logs in Coolify for the installation error and redeploy.</p>'
                  printf '%s\n' '</div></div></body></html>'
                } > /var/www/html/public/_coolify_error.html
              fi
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done
          if [ -f /var/www/html/artisan ]; then
            echo "Laravel is ready!"
            rm -f /var/www/html/public/_coolify_error.html 2>/dev/null || true
          fi

          echo "Starting supervisor..."
          exec /usr/bin/supervisord -c /etc/supervisord.conf
    environment:
      - SERVICE_GITHUB_REPO_URL=$SERVICE_GITHUB_REPO_URL
      - SERVICE_GITHUB_BRANCH=$SERVICE_GITHUB_BRANCH
      - SERVICE_PHP_VERSION=$SERVICE_PHP_VERSION
      - SERVICE_FQDN_NGINX
      - SERVICE_FQDN_NGINX_80
      - APP_NAME=Laravel RootKit
      - APP_ENV=${SERVICE_LARAVEL_APP_ENV:-production}
      - APP_DEBUG=${SERVICE_LARAVEL_APP_DEBUG:-false}
      - LOG_CHANNEL=stack
      - LOG_LEVEL=${SERVICE_LARAVEL_LOG_LEVEL:-debug}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${SERVICE_DATABASE_LARAVEL}
      - DB_USERNAME=${SERVICE_USER_LARAVEL:-laravel}
      - DB_PASSWORD=${SERVICE_PASSWORD_LARAVEL:-password}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=file
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - SERVICE_LARAVEL_SCHEDULER_ENABLED=${SERVICE_LARAVEL_SCHEDULER_ENABLED:-true}
      - SERVICE_LARAVEL_QUEUE_NAMES=${SERVICE_LARAVEL_QUEUE_NAMES:-default}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && test -f /var/www/html/artisan && php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 900s
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  nginx:
    image: nginx:alpine
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - laravel-files:/var/www/html:ro
      - type: bind
        source: ./nginx-main.conf
        target: /etc/nginx/nginx.conf
        content: |
          user nginx;
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /var/run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              aio off;
              aio_write off;
              sendfile off;
              directio off;
              keepalive_timeout 65;
              client_max_body_size 100M;

              # Translate X-Forwarded-Proto into a safe on/off value so that
              # fastcgi_param HTTPS is only truthy when the upstream proxy
              # actually terminated TLS. Passing the raw $http_x_forwarded_proto
              # string would make Laravel treat HTTP requests as HTTPS because
              # Symfony::isSecure() accepts any non-"off" value.
              map $http_x_forwarded_proto $fastcgi_https {
                  default off;
                  https on;
              }

              include /etc/nginx/conf.d/*.conf;
          }
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
              listen 80;
              server_name _;
              root /var/www/html/public;
              index index.php index.html;
              aio off;
              aio_write off;

              client_max_body_size 100M;

              access_log /dev/stdout;
              error_log /dev/stderr;

              resolver 127.0.0.11 ipv6=off valid=10s;
              set $php_upstream "laravel:9000";

              location / {
                  # Pre-flight error page intercept. When the laravel
                  # container's entrypoint detects a PHP version
                  # mismatch (composer.json requires a version this
                  # container does not run) it writes a Spanish
                  # step-by-step error page to
                  # public/_coolify_preflight_error.html and skips
                  # composer install. This try_files serves that
                  # page first so the user sees actionable
                  # instructions instead of a 500 / raw PHP error.
                  # On a successful redeploy the entrypoint deletes
                  # the file and this line becomes a silent no-op
                  # (try_files falls through to the normal Laravel
                  # routing).
                  try_files /_coolify_preflight_error.html $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_pass $php_upstream;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
                  fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
                  fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
                  fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
                  fastcgi_param HTTPS $fastcgi_https;
                  fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto;
                  include fastcgi_params;
                  fastcgi_read_timeout 300;
                  fastcgi_buffers 16 16k;
                  fastcgi_buffer_size 32k;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
    # Start nginx as soon as laravel container exists (not after Laravel healthcheck).
    # Otherwise nginx container can be missing for a long time and the UI may show "No such container".
    # Users may briefly see 502 until PHP-FPM is ready; nginx healthcheck stays config-only for stability.
    depends_on:
      laravel:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=${SERVICE_DATABASE_LARAVEL}
      - MYSQL_USER=${SERVICE_USER_LARAVEL:-laravel}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_LARAVEL:-password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    expose:
      - "80"
    environment:
      - SERVICE_URL_PHPMYADMIN
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=$SERVICE_PASSWORD_ROOT
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - PMA_ABSOLUTE_URI=$SERVICE_URL_PHPMYADMIN/
      - UPLOAD_LIMIT=300M
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@fsockopen(\"127.0.0.1\",80));'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  laravel-files:
  mariadb-data:
