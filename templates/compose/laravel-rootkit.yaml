# documentation: https://laravel.com/docs
# slogan: Despliega Laravel RootKit desde GitHub con MariaDB y phpMyAdmin
# category: framework
# tags: laravel, php, framework, web, application, mariadb, phpmyadmin, github, rootkit
# logo: svgs/laravel.svg

services:
  laravel:
    image: php:${SERVICE_PHP_VERSION:-8.4}-fpm-alpine
    volumes:
      - laravel-files:/var/www/html
      - type: bind
        source: ./supervisord.conf
        target: /etc/supervisord.conf
        content: |
          [supervisord]
          nodaemon=true
          pidfile=/tmp/supervisord.pid
          logfile=/dev/null
          logfile_maxbytes=0
          loglevel=info

          [program:php-fpm]
          command=php-fpm
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:scheduler]
          command=sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'Waiting for Laravel installation...'; sleep 10; done; cd /var/www/html && php artisan optimize:clear >/dev/null 2>&1 || true; php artisan config:clear >/dev/null 2>&1 || true; while true; do if [ \"${SERVICE_LARAVEL_SCHEDULER_ENABLED:-true}\" != \"true\" ]; then echo 'Laravel scheduler disabled via SERVICE_LARAVEL_SCHEDULER_ENABLED'; sleep 60; continue; fi; if php artisan schedule:list --no-interaction >/dev/null 2>&1; then php artisan schedule:run --no-interaction 2>&1; else echo 'Laravel scheduler unavailable, retrying in 60 seconds'; fi; sleep 60; done"
          user=www-data
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:queue-worker]
          process_name=%(program_name)s_%(process_num)02d
          command=sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'Waiting for Laravel installation...'; sleep 10; done; php /var/www/html/artisan queue:work --queue=${SERVICE_LARAVEL_QUEUE_NAMES:-default} --sleep=3 --tries=3 --max-time=3600"
          user=www-data
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true
          numprocs=6
          stopwaitsecs=3600

      - type: bind
        source: ./entrypoint.sh
        target: /entrypoint.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -e

          echo "Starting Laravel RootKit deployment from GitHub..."

          chmod +x /entrypoint.sh 2>/dev/null || true

          if ! command -v supervisord >/dev/null 2>&1; then
            echo "Installing supervisor and required packages..."
            apk add --no-cache supervisor curl git unzip nodejs npm
          fi

          # Install the superset of PHP extensions every recent
          # Laravel version needs (9, 10, 11, 12). Keeping this as a
          # single list instead of branching per-Laravel-version
          # means the image warms once and then boots faster on
          # every redeploy regardless of what the user's composer.json
          # asks for. Extra extensions beyond what upstream ships:
          #   - pcntl/sockets: Laravel Horizon, Octane, Reverb
          #   - pdo_pgsql:    Laravel projects that use Postgres
          #                   instead of (or in addition to) MySQL
          #   - soap:         SOAP-based integrations (rare but
          #                   blocks composer install when required)
          #   - redis (pecl): common Laravel cache/queue driver
          REQUIRED_EXTS="pdo_mysql pdo_pgsql zip bcmath gd intl exif mbstring opcache pcntl sockets soap"
          MISSING_EXTS=""
          for ext in $REQUIRED_EXTS; do
            if ! php -m | grep -qi "^${ext}$"; then
              MISSING_EXTS="$MISSING_EXTS $ext"
            fi
          done
          if [ -z "$MISSING_EXTS" ] && php -m | grep -qi "^redis$"; then
            echo "PHP extensions already installed..."
          else
            echo "Installing PHP extensions:${MISSING_EXTS:- (redis pecl only)}"
            apk add --no-cache \
              libzip-dev \
              mysql-client \
              mariadb-client \
              postgresql-dev \
              postgresql-client \
              freetype-dev \
              libjpeg-turbo-dev \
              libpng-dev \
              oniguruma-dev \
              icu-dev \
              libxml2-dev \
              linux-headers \
              $PHPIZE_DEPS
            docker-php-ext-configure gd --with-freetype --with-jpeg 2>/dev/null || true
            # Install the core set — `|| true` on individual fails so
            # an older PHP image missing one extension does not kill
            # the whole boot. The important ones (pdo_mysql, mbstring,
            # opcache, gd) are validated again below and the boot
            # aborts only if those specifically are absent.
            #
            # IMPORTANT: docker-php-ext-install does NOT always
            # auto-enable the extension after building it. opcache in
            # particular is a `zend_extension`, not a regular
            # `extension`, and on some PHP base images (notably
            # 8.2-fpm-alpine) docker-php-ext-install builds opcache.so
            # but never writes the conf.d/docker-php-ext-opcache.ini
            # file with `zend_extension=opcache.so`. The result: the
            # build "succeeds" but `php -m` does not show opcache,
            # and the hard-fail check below kills the container in a
            # restart loop. Calling docker-php-ext-enable explicitly
            # after EVERY install is idempotent (a no-op when the
            # extension was already enabled) and fixes that race.
            for ext in $MISSING_EXTS; do
              if docker-php-ext-install -j"$(nproc)" "$ext" 2>/dev/null; then
                docker-php-ext-enable "$ext" 2>/dev/null || true
              else
                echo "WARN: Could not install PHP extension '$ext' — continuing"
              fi
            done
            # Redis is a pecl extension, install separately so a
            # pecl registry hiccup does not block the core ones.
            if ! php -m | grep -qi "^redis$"; then
              pecl install redis 2>/dev/null \
                && docker-php-ext-enable redis 2>/dev/null \
                || echo "WARN: Could not install redis pecl extension — Laravel queue/cache on redis will fail"
            fi
          fi

          # Last-line safety net before the hard-fail check: if opcache
          # is on disk but not loaded (the exact failure mode on
          # 8.2-fpm-alpine described above), force-enable it. This
          # also covers the case where the container was rebuilt and
          # the conf.d file was lost but the .so survived.
          if ! php -m | grep -qi '^opcache$'; then
            docker-php-ext-enable opcache 2>/dev/null || true
          fi

          # Hard-fail only if the essential four are missing — everything
          # else is a "nice to have" that should not block the boot.
          for essential in pdo_mysql mbstring opcache gd; do
            if ! php -m | grep -qi "^${essential}$"; then
              echo "FATAL: PHP extension '$essential' is missing after install attempt. Laravel cannot boot without it." >&2
              exit 1
            fi
          done

          if ! grep -q "listen = 0.0.0.0:9000" /usr/local/etc/php-fpm.d/www.conf 2>/dev/null; then
            sed -i 's/listen = 127.0.0.1:9000/listen = 0.0.0.0:9000/' /usr/local/etc/php-fpm.d/www.conf
            sed -i 's/;clear_env = no/clear_env = no/' /usr/local/etc/php-fpm.d/www.conf
          fi

          if ! command -v composer >/dev/null 2>&1; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            chmod +x /usr/local/bin/composer
          fi

          mkdir -p /var/www/html
          cd /var/www/html

          mkdir -p /var/www/html/public
          if [ ! -f /var/www/html/artisan ]; then
            {
              printf '%s\n' '<!doctype html>'
              printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
              printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
              printf '%s\n' '<title>Coolify: Laravel provisioning</title>'
              printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
              printf '%s\n' '<div class="wrap"><div class="card">'
              printf '%s\n' '<h1>Provisioning in progress</h1>'
              printf '%s\n' '<p>Coolify is cloning the repository and installing dependencies. This can take a few minutes on first deploy.</p>'
              printf '%s\n' '<p class="muted">If this page does not change, check the Laravel logs in Coolify for the root cause.</p>'
              printf '%s\n' '</div></div></body></html>'
            } > /var/www/html/public/_coolify_error.html
          fi

          REPO_URL="${SERVICE_GITHUB_REPO_URL:-https://github.com/crmhawkins/copiservi.git}"
          REPO_BRANCH="${SERVICE_GITHUB_BRANCH:-main}"
          GITHUB_TOKEN="${SERVICE_GITHUB_TOKEN:-}"

          REPO_URL="${REPO_URL%/}"
          # REPO_URL_PUBLIC is the version WITHOUT the embedded token. It is
          # what ends up in .git/config after clone/fetch so the token is not
          # persisted on disk, where anyone with shell access could read it.
          REPO_URL_PUBLIC="${REPO_URL}"
          if [ -n "${GITHUB_TOKEN}" ]; then
            if echo "${REPO_URL}" | grep -Eq '^git@github\.com:'; then
              REPO_URL_PUBLIC="https://github.com/${REPO_URL#git@github.com:}"
              REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_URL#git@github.com:}"
            elif echo "${REPO_URL}" | grep -Eq '^https?://(www\.)?github\.com/'; then
              REPO_URL_PUBLIC="$(echo "${REPO_URL}" | sed -E 's#^https?://(www\.)?github\.com/#https://github.com/#')"
              REPO_URL="$(echo "${REPO_URL}" | sed -E "s#^https?://(www\.)?github\.com/#https://x-access-token:${GITHUB_TOKEN}@github.com/#")"
            fi
          fi
          SERVICE_PUBLIC_URL_RUNTIME=""
          if [ -z "${SERVICE_PUBLIC_URL_RUNTIME}" ] && [ -n "${SERVICE_FQDN_NGINX:-}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="https://${SERVICE_FQDN_NGINX}"
          fi
          if [ -z "${SERVICE_PUBLIC_URL_RUNTIME}" ] && [ -n "${SERVICE_FQDN_NGINX_80:-}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="https://${SERVICE_FQDN_NGINX_80%:80}"
          fi
          if [ -z "${SERVICE_PUBLIC_URL_RUNTIME}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="${SERVICE_URL_NGINX:-${SERVICE_URL_NGINX_80:-}}"
          fi
          if [ -n "${SERVICE_PUBLIC_URL_RUNTIME}" ] && [ "${SERVICE_PUBLIC_URL_RUNTIME#http://}" != "${SERVICE_PUBLIC_URL_RUNTIME}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="https://${SERVICE_PUBLIC_URL_RUNTIME#http://}"
          fi

          if [ ! -d .git ]; then
            if [ -n "${GITHUB_TOKEN}" ]; then
              echo "Cloning repository (branch: ${REPO_BRANCH}) using GitHub token..."
            else
              echo "Cloning repository ${REPO_URL_PUBLIC} (branch: ${REPO_BRANCH})..."
            fi
            rm -rf * .[!.]* 2>/dev/null || true
            git clone --depth 1 --no-tags --branch "${REPO_BRANCH}" --single-branch "${REPO_URL}" .
            # Remove the token from .git/config so a long-lived container
            # cannot leak it. Subsequent fetches use GIT_ASKPASS below.
            git remote set-url origin "${REPO_URL_PUBLIC}"
          else
            echo "Repository already exists. Syncing branch ${REPO_BRANCH}..."
            # Ensure the on-disk remote url is the tokenless one before fetch.
            git remote set-url origin "${REPO_URL_PUBLIC}" 2>/dev/null || true
            set +e
            if [ -n "${GITHUB_TOKEN}" ]; then
              # Inject the token via a one-shot Authorization header so it is
              # never persisted in .git/config. base64 -w0 is the GNU flag and
              # fails silently on BusyBox; fall back to plain base64 in that case.
              AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0 2>/dev/null \
                || printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
              git -c "http.extraHeader=Authorization: Basic ${AUTH_B64}" \
                fetch --prune origin 2>&1
              unset AUTH_B64
            else
              git fetch --prune origin 2>&1
            fi
            git checkout -B "${REPO_BRANCH}" "origin/${REPO_BRANCH}" 2>&1
            GIT_SYNC_EXIT="$?"
            set -e
            if [ "$GIT_SYNC_EXIT" -ne 0 ]; then
              echo "Failed to checkout branch ${REPO_BRANCH}. Falling back to repository default branch."
              set +e
              DEFAULT_BRANCH="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's#^refs/remotes/origin/##')"
              set -e
              if [ -n "$DEFAULT_BRANCH" ]; then
                echo "Default branch detected: ${DEFAULT_BRANCH}"
                git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH" 2>&1 || true
              else
                echo "Could not determine default branch; keeping working tree as-is."
              fi
            fi
          fi

          git config --global --add safe.directory /var/www/html || true

          # ============================================================
          # PRE-FLIGHT PHP version check
          # ============================================================
          # Parses composer.json BEFORE running composer install and
          # checks that the container's PHP major.minor satisfies the
          # constraint the project declares. If it does not, we write
          # a Spanish, step-by-step error page that tells the user
          # (including a non-dev deploying for a client) the exact
          # value to put in Coolify's SERVICE_PHP_VERSION, then skip
          # straight to supervisord so nginx serves the page.
          #
          # Why: without this check the user would get the raw composer
          # error "project requires php ^8.0.2|^8.1|^8.2 — your system
          # has 8.4.1" buried in logs, and no clear indication of what
          # to change in the Coolify UI. With it, the first failed
          # deploy is self-explanatory and the fix is two minutes of
          # clicking.
          #
          # Always runs before composer install. Clean-slates any
          # leftover error pages from a previous boot so a successful
          # redeploy doesn't keep showing a stale error.
          rm -f /var/www/html/public/_coolify_preflight_error.html \
                /var/www/html/public/_coolify_error.html 2>/dev/null || true

          # PHP parser written to /tmp so we don't have to escape
          # everything for shell. Quoted heredoc ('PREFLIGHT_PHP_EOF')
          # means NO shell expansion happens inside — the $variables
          # you see are PHP variables, not shell ones.
          cat > /tmp/coolify-preflight.php <<'PREFLIGHT_PHP_EOF'
          <?php
          // Coolify Laravel RootKit pre-flight PHP version check.
          // Emits KEY=VALUE lines on stdout. The calling shell script
          // reads them and decides whether to abort with an error page.
          $file = 'composer.json';
          $current = PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;

          if (!file_exists($file)) {
              echo "STATUS=SKIP_NO_COMPOSER_JSON\nCURRENT=$current\n";
              exit(0);
          }

          $raw = @file_get_contents($file);
          $json = @json_decode((string) $raw, true);
          if (!is_array($json)) {
              echo "STATUS=SKIP_INVALID_JSON\nCURRENT=$current\n";
              exit(0);
          }

          $constraint = $json['require']['php'] ?? null;
          if (!is_string($constraint) || trim($constraint) === '') {
              echo "STATUS=SKIP_NO_CONSTRAINT\nCURRENT=$current\n";
              exit(0);
          }
          $constraint = trim($constraint);

          // Candidate PHP minor versions, highest first. These track
          // what the php:X.Y-fpm-alpine official image ships as of
          // April 2026. Update this list when a new PHP major/minor
          // gets an official alpine image.
          $candidates = ['8.4', '8.3', '8.2', '8.1', '8.0'];

          function v_num(int $maj, int $min, int $patch): int {
              return $maj * 10000 + $min * 100 + $patch;
          }

          function v_tuple(string $v): array {
              $p = explode('.', $v);
              return [(int) ($p[0] ?? 0), (int) ($p[1] ?? 0), (int) ($p[2] ?? 0)];
          }

          function satisfies_atom(string $v, string $atom): bool {
              $atom = trim($atom);
              if ($atom === '' || $atom === '*') {
                  return true;
              }
              [$vMaj, $vMin, $vPatch] = v_tuple($v);
              $vN = v_num($vMaj, $vMin, $vPatch);

              // ^X.Y or ^X.Y.Z → >=X.Y.Z, <(X+1).0.0
              if (preg_match('/^\^(\d+)\.(\d+)(?:\.(\d+))?$/', $atom, $m)) {
                  $maj = (int) $m[1];
                  $min = (int) $m[2];
                  $patch = (int) ($m[3] ?? 0);
                  return $vN >= v_num($maj, $min, $patch) && $vN < v_num($maj + 1, 0, 0);
              }
              // ~X.Y → >=X.Y, <(X+1).0 ; ~X.Y.Z → >=X.Y.Z, <X.(Y+1).0
              if (preg_match('/^~(\d+)\.(\d+)(?:\.(\d+))?$/', $atom, $m)) {
                  $maj = (int) $m[1];
                  $min = (int) $m[2];
                  $hasPatch = isset($m[3]) && $m[3] !== '';
                  $patch = $hasPatch ? (int) $m[3] : 0;
                  $floor = v_num($maj, $min, $patch);
                  $ceil = $hasPatch ? v_num($maj, $min + 1, 0) : v_num($maj + 1, 0, 0);
                  return $vN >= $floor && $vN < $ceil;
              }
              // Comparison operators: >=, >, <=, <, = (or bare X.Y / X.Y.Z)
              if (preg_match('/^(>=|>|<=|<|=)?(\d+)\.(\d+)(?:\.(\d+))?$/', $atom, $m)) {
                  $op = $m[1] ?: '=';
                  $t = v_num((int) $m[2], (int) $m[3], (int) ($m[4] ?? 0));
                  switch ($op) {
                      case '>=': return $vN >= $t;
                      case '>':  return $vN > $t;
                      case '<=': return $vN <= $t;
                      case '<':  return $vN < $t;
                      default:
                          // Bare "X.Y" or "X.Y.Z" → treat as "same
                          // major.minor", ignoring any patch number.
                          // This is deliberately LOOSER than composer's
                          // strict semver: projects that pin an exact
                          // "8.2.12" rarely mean "reject 8.2.15", they
                          // just copy-pasted from somewhere. Our
                          // candidate list is X.Y only, so a minor
                          // match is the most useful interpretation.
                          return $vMaj === (int) $m[2] && $vMin === (int) $m[3];
                  }
              }
              // Wildcards: X.Y.* and X.*
              if (preg_match('/^(\d+)\.(\d+)\.\*$/', $atom, $m)) {
                  return $vMaj === (int) $m[1] && $vMin === (int) $m[2];
              }
              if (preg_match('/^(\d+)\.\*$/', $atom, $m)) {
                  return $vMaj === (int) $m[1];
              }
              // Unknown / exotic constraint — be permissive and let
              // composer catch it, instead of blocking the deploy on
              // a format we did not anticipate.
              return true;
          }

          function satisfies_constraint(string $v, string $constraint): bool {
              // OR groups separated by | or ||
              $orParts = preg_split('/\s*\|\|?\s*/', $constraint);
              if ($orParts === false) {
                  $orParts = [$constraint];
              }
              foreach ($orParts as $orPart) {
                  // AND groups separated by space or comma
                  $andParts = preg_split('/[\s,]+/', trim($orPart));
                  if ($andParts === false) {
                      $andParts = [$orPart];
                  }
                  $allMatch = true;
                  foreach ($andParts as $atom) {
                      $atom = trim($atom);
                      if ($atom === '') {
                          continue;
                      }
                      if (!satisfies_atom($v, $atom)) {
                          $allMatch = false;
                          break;
                      }
                  }
                  if ($allMatch) {
                      return true;
                  }
              }
              return false;
          }

          $matches = [];
          foreach ($candidates as $v) {
              if (satisfies_constraint($v, $constraint)) {
                  $matches[] = $v;
              }
          }
          $currentOk = satisfies_constraint($current, $constraint);

          // -----------------------------------------------------------
          // Known runtime-incompatible combinations (composer.lock-based)
          // -----------------------------------------------------------
          // composer.json can declare a loose PHP constraint (e.g.
          // Laravel 9's "^8.0.2") that composer install accepts on
          // PHP 8.4, but the installed dep tree may include packages
          // that explode at runtime on newer PHP versions. Livewire
          // 2.x is the canonical case: it declares "^8.0" (which
          // covers 8.4) but its source uses utf8_encode() and other
          // removed-in-8.2+ functions that crash the first request.
          //
          // We maintain a small, explicit table of "known bad combos"
          // and filter the candidate set further so the preflight
          // still recommends the correct max PHP version for projects
          // that carry those packages. Add new entries when you hit
          // a reproducible runtime incompatibility that composer
          // itself doesn't catch.
          $knownIssues = [
              [
                  'package' => 'livewire/livewire',
                  'versionRegex' => '/^v?[12]\./',
                  'maxPhpMinor' => 802, // PHP 8.2 max
                  'reason' => 'Livewire 2.x no arranca en PHP 8.3+ (utf8_encode y otras deprecations eliminadas)',
              ],
          ];

          $activeIssues = [];
          if (file_exists('composer.lock')) {
              $lockRaw = @file_get_contents('composer.lock');
              $lockData = @json_decode((string) $lockRaw, true);
              if (is_array($lockData)) {
                  $installed = [];
                  foreach (($lockData['packages'] ?? []) as $pkg) {
                      if (is_array($pkg) && isset($pkg['name'], $pkg['version'])) {
                          $installed[(string) $pkg['name']] = (string) $pkg['version'];
                      }
                  }
                  foreach ($knownIssues as $issue) {
                      $pkgName = $issue['package'];
                      if (!isset($installed[$pkgName])) {
                          continue;
                      }
                      if (!preg_match($issue['versionRegex'], $installed[$pkgName])) {
                          continue;
                      }
                      $activeIssues[] = $issue + ['installedVersion' => $installed[$pkgName]];
                  }
              }
          }

          if (!empty($activeIssues)) {
              // Re-filter the candidate match list under all active
              // runtime-issue ceilings. Also re-check whether current
              // PHP is still acceptable under the combined rules.
              $filtered = [];
              foreach ($matches as $c) {
                  [$cMaj, $cMin] = v_tuple($c);
                  $cNum = $cMaj * 100 + $cMin;
                  $allowed = true;
                  foreach ($activeIssues as $issue) {
                      if ($cNum > $issue['maxPhpMinor']) {
                          $allowed = false;
                          break;
                      }
                  }
                  if ($allowed) {
                      $filtered[] = $c;
                  }
              }
              $matches = $filtered;

              [$curMaj, $curMin] = v_tuple($current);
              $curNum = $curMaj * 100 + $curMin;
              $currentOk = false;
              foreach ($matches as $c) {
                  [$cMaj, $cMin] = v_tuple($c);
                  if ($cMaj === $curMaj && $cMin === $curMin) {
                      $currentOk = true;
                      break;
                  }
              }

              // Annotate the constraint string so the generated error
              // page shows the real reason ("your composer.json says
              // X but we detected Livewire 2 which caps PHP at Y").
              $reasonParts = [];
              foreach ($activeIssues as $issue) {
                  $reasonParts[] = $issue['package'] . ' ' . $issue['installedVersion'] . ': ' . $issue['reason'];
              }
              $constraint = $constraint . ' | ' . implode(' | ', $reasonParts);
          }

          $status = $currentOk ? 'OK' : (empty($matches) ? 'NO_SUPPORTED_VERSION' : 'MISMATCH');
          echo "STATUS=$status\n";
          echo "CURRENT=$current\n";
          echo "CONSTRAINT=$constraint\n";
          echo "BEST=" . ($matches[0] ?? 'NONE') . "\n";
          echo "ALL_MATCHES=" . implode(',', $matches) . "\n";
          PREFLIGHT_PHP_EOF

          PREFLIGHT_OUTPUT="$(cd /var/www/html && php /tmp/coolify-preflight.php 2>&1 || true)"
          rm -f /tmp/coolify-preflight.php

          PF_STATUS="$(printf '%s\n' "$PREFLIGHT_OUTPUT" | grep '^STATUS=' | head -n 1 | cut -d= -f2-)"
          PF_CURRENT="$(printf '%s\n' "$PREFLIGHT_OUTPUT" | grep '^CURRENT=' | head -n 1 | cut -d= -f2-)"
          PF_CONSTRAINT="$(printf '%s\n' "$PREFLIGHT_OUTPUT" | grep '^CONSTRAINT=' | head -n 1 | cut -d= -f2-)"
